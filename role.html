<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Area kerja sementara WASHUP" />
    <title>Area Kerja | WASHUP</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="role-page">
    <div class="app-shell role-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="WASHUP Beranda">
          <span class="brand-mark">W</span>
          <span>
            <strong>WASHUP</strong>
            <small>Sistem Informasi Car Wash</small>
          </span>

        <button class="secondary-button" id="logout-button" type="button">Keluar</button>

      <main class="role-main">

          <span class="role-icon" aria-hidden="true">W</span>

          <p id="role-message">Halaman dashboard akan dikembangkan pada tahap berikutnya.</p>
          <span class="badge badge-blue">Login berhasil</span>
        </section>
      </main>

      <footer class="footer">
        <span>WASHUP</span>
        <span id="current-year"></span>
      </footer>
    </div>

    <script src="js/app.js"></script>
