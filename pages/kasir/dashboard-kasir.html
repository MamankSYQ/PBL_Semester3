<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard Kasir WASHUP - Sistem Informasi Car Wash" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard Kasir | WASHUP</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Emblema+One&family=Open+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="../../css/tokens.css" />
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/kasir.css" />
    <link rel="stylesheet" href="../../css/sidebar-collapse.css" />
    <link rel="stylesheet" href="../../css/compact.css" />
  </head>
  <body class="dashboard-page kasir-dashboard-page kasir-page" data-role="Kasir" data-page="dashboard" data-title="Dashboard Kasir" data-logout-id="kasir-dashboard-logout">
    <div class="dashboard-shell">
      <div data-component="sidebar"></div>
      <div class="dashboard-content">
        <div data-component="topbar"></div>
<main class="dashboard-main kasir-main">
          <!-- C. AREA SAMBUTAN -->
          <section class="dashboard-welcome" aria-labelledby="welcome-title">
            <p class="eyebrow">RINGKASAN PENGERJAAN</p>
            <h2 id="welcome-title">Selamat Datang, Kasir!</h2>
            <span class="admin-date-chip date-chip" id="kasir-date">17 Agustus 2026</span>
          </section>
          <!-- D. EMPAT KARTU STATISTIK -->
          <section class="summary-grid" aria-label="Ringkasan operasional hari ini">
            <!-- Kartu 1: Kendaraan Hari Ini (ant-design:car-outlined) -->
            <article class="summary-card">
              <div class="summary-card-top">
                <div class="summary-icon-box" data-icon="car" aria-hidden="true"></div>
              </div>
              <div>
                <p>Kendaraan Hari Ini</p>
                <strong id="vehicle-count">0</strong>
              </div>
            </article>
            <!-- Kartu 2: Transaksi Hari Ini (akar-icons:check-box) -->
            <article class="summary-card">
              <div class="summary-card-top">
                <div class="summary-icon-box" data-icon="receipt-calendar" aria-hidden="true"></div>
              </div>
              <div>
                <p>Transaksi Hari Ini</p>
                <strong id="transaction-count">0</strong>
              </div>
            </article>
            <!-- Kartu 3: Transaksi Hari Ini (grommet-icons:transaction) -->
            <article class="summary-card">
              <div class="summary-card-top">
                <div class="summary-icon-box" data-icon="car-queue" aria-hidden="true"></div>
              </div>
              <div>
                <p>Antrean Berjalan</p>
                <strong id="queue-count">0</strong>
              </div>
            </article>
            <!-- Kartu 4: Total Transaksi Hari Ini (fa7-solid:rupiah-sign) -->
            <article class="summary-card">
              <div class="summary-card-top">
                <div class="summary-icon-box" data-icon="rupiah" aria-hidden="true"></div>
              </div>
              <div>
                <p>Pendapatan Hari Ini</p>
                <strong id="revenue-total">Rp 0</strong>
              </div>
            </article>
          </section>
          <!-- E. PANEL ANTREAN SAAT INI -->
          <section class="dashboard-section" id="antrean-section" aria-labelledby="queue-title">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Kendaraan Hari Ini</p>
                <h2 id="queue-title">Antrean Saat Ini</h2>
              </div>
              <span class="badge badge-blue hide-visual" id="queue-badge" hidden>0 kendaraan aktif</span>
            </div>
            <div class="table-wrap" tabindex="0">
              <table class="queue-table">
                <caption class="sr-only">Daftar antrean kendaraan saat ini</caption>
                <thead>
                  <tr>
                    <th scope="col">NO.</th>
                    <th scope="col">PLAT</th>
                    <th scope="col">KENDARAAN</th>
                    <th scope="col">LAYANAN</th>
                    <th scope="col">STATUS</th>
                  </tr>
                </thead>
                <tbody id="queue-table-body"></tbody>
              </table>
            </div>
            <nav class="wu-pager" id="queue-pager" aria-label="Navigasi halaman antrean" hidden></nav>
          </section>
          <!-- F. FOOTER -->
</main>
        <div data-component="footer"></div>
      </div>
    </div>
<script src="../../js/components.js"></script>
    <script src="../../js/app.js"></script>
  </body>
</html>
